<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%23F47B35'/><text x='50' y='65' font-family='sans-serif' font-weight='800' font-size='46' fill='%23FFF9F0' text-anchor='middle'>MV</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>Meruva Venkatesh | Aspiring Data Analyst & AI/ML Developer</title>
    <meta name="title" content="Meruva Venkatesh | Aspiring Data Analyst & AI/ML Developer" />
    <meta name="description" content="Portfolio of Meruva Venkatesh — Aspiring Data Analyst and AI/ML Developer based in Bengaluru, India. Skilled in Python, SQL, Power BI, Excel, and Machine Learning." />
    <meta name="keywords" content="Meruva Venkatesh, Data Analyst, AI/ML Developer, Portfolio, Power BI, Python, SQL, Bengaluru, Machine Learning" />
    <meta name="author" content="Meruva Venkatesh" />
    <meta name="theme-color" content="#FFF9F0" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Meruva Venkatesh | Aspiring Data Analyst & AI/ML Developer" />
    <meta property="og:description" content="Turning Data Into Insights. Building Intelligent Solutions." />

    <!-- Google Fonts: Plus Jakarta Sans, Playfair Display & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Pre-render Theme Initialization Script to prevent FOUT -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#242321');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#FFF9F0] dark:bg-[#242321] text-[#242321] dark:text-[#FFF9F0] font-sans antialiased selection:bg-[#F47B35]/20 selection:text-[#F47B35] transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
